<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmed & Kholoud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#150f0d; --card:#241b17; --text:#ecdfd0; --sub:#a8917d;
    --accent:#c79a6b; --accent2:#d9ac96; --border:#3c2e27; --gold:#cba36e;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'EB Garamond','Georgia','Tahoma',serif;
    font-size:18px;
    min-height:100%; padding:32px 16px 60px;
  }
  .wrap{max-width:620px; margin:0 auto; opacity:0; animation:fadeIn 1s ease .2s forwards;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .topbar{display:flex; justify-content:flex-end; margin-bottom:6px;}
  .lang-btn{
    background:var(--card); border:1px solid var(--gold); color:var(--accent2);
    padding:6px 16px; border-radius:20px; font-family:'Italiana',serif;
    font-size:.8em; cursor:pointer;
  }
  h1{
    font-family:'Italiana', Georgia, serif;
    text-align:center; font-size:2.4em; letter-spacing:2px; margin:8px 0 6px;
    color:var(--accent2); font-weight:600;
  }
  .divider{text-align:center; color:var(--gold); font-size:1.1em; margin-bottom:6px;}
  .sub{text-align:center; color:var(--sub); margin-bottom:32px; font-size:1.05em; letter-spacing:1px; font-style:italic;}
  body.ar .sub{font-style:normal;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:26px; margin-bottom:22px; box-shadow:0 6px 20px rgba(140,122,88,0.08);
  }
  .card h2{
    font-family:'Italiana', Georgia, serif;
    margin-top:0; color:var(--accent2); font-size:1.25em; font-weight:600;
    letter-spacing:.5px;
  }
  .timer{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .t-box{
    background:var(--bg); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; min-width:72px; text-align:center;
  }
  .t-box .num{font-family:'Italiana',serif; font-size:1.7em; font-weight:600; color:var(--accent2);}
  .t-box .lbl{font-size:.72em; color:var(--sub); letter-spacing:.5px; text-transform:uppercase;}
  .letter{line-height:1.9; font-size:1.15em; text-align:center; font-style:italic;}
  body.ar .letter{font-style:normal; line-height:2.1;}
  .letter h2{font-style:normal; font-family:'Italiana',serif;}
  .letter-text{white-space:pre-line;}
  .cursor{display:inline-block; animation:blink 0.8s step-start infinite;}
  @keyframes blink{50%{opacity:0;}}
  .carousel{position:relative; width:100%; max-width:420px; margin:8px auto 0; border-radius:16px; overflow:hidden; aspect-ratio:3/4; background:var(--bg);}
  .carousel img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1s ease;}
  .carousel img.active{opacity:1;}
  .car-btn{
    position:absolute; top:50%; transform:translateY(-50%); background:rgba(20,15,13,0.45); color:#fff;
    border:none; width:32px; height:32px; border-radius:50%; font-size:1.1em; cursor:pointer; z-index:5;
    display:flex; align-items:center; justify-content:center;
  }
  .car-prev{left:8px;} .car-next{right:8px;}
  .car-dots{display:flex; justify-content:center; gap:6px; margin-top:12px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--border); cursor:pointer; border:none; padding:0;}
  .dot.active{background:var(--accent2);}
  .heart{text-align:center; font-size:1.3em; margin-top:14px; color:var(--gold);}

  #splash{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .7s ease;
  }
  #splash.hide{opacity:0; pointer-events:none;}
  #splash .emoji{font-size:4em; animation:beat 1.1s ease-in-out infinite;}
  @keyframes beat{0%,100%{transform:scale(1);} 50%{transform:scale(1.25);}}

  .couple-card{text-align:center; padding-bottom:18px;}
  #boy, #girl{transition:transform 1.1s ease;}
  .arm{transition:transform .9s ease;}
  #boy.hug{transform:translate(30px,6px) rotate(-4deg);}
  #girl.hug{transform:translate(-30px,6px) rotate(4deg);}
  #boyArm.hug{transform:rotate(28deg) translate(2px,10px);}
  #girlArm.hug{transform:rotate(-28deg) translate(-2px,10px);}
  .join-dot{transition:opacity .5s ease;}
  .join-dot.hug{opacity:0;}
  .pop-heart{opacity:0; font-size:1.4em; transition:opacity .6s ease .6s, transform .6s ease .6s;}
  .pop-heart.hug{opacity:1; transform:translateY(-6px);}

  .letter-toggle{text-align:center; margin-bottom:18px;}
  .letter-btn{
    background:var(--card); border:1px solid var(--gold); color:var(--accent2);
    padding:11px 26px; border-radius:30px; font-family:'Italiana',serif;
    font-size:.95em; letter-spacing:.5px; cursor:pointer; transition:transform .2s;
  }
  .letter-btn:hover{transform:scale(1.05);}
  .letter{display:none;}
  .letter.reveal{display:block; animation:revealIn .6s ease;}
  @keyframes revealIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  .love-wrap{text-align:center; margin-bottom:26px;}
  .love-btn{
    background:linear-gradient(135deg, var(--accent), var(--gold));
    border:none; color:#fff; padding:14px 34px; border-radius:32px;
    font-family:'Italiana',serif; font-size:1.05em; letter-spacing:.5px;
    cursor:pointer; box-shadow:0 6px 16px rgba(140,110,90,0.25); transition:transform .2s;
  }
  .love-btn:active{transform:scale(0.96);}
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px);
    background:var(--accent2); color:#fff; padding:12px 22px; border-radius:24px;
    font-family:'Italiana',serif; font-size:.95em; opacity:0;
    transition:opacity .4s ease, transform .4s ease; z-index:200; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}
</style>
</head>
<body>
<div id="splash"><span class="emoji">❤️</span></div>
<div class="wrap">
  <div class="topbar"><button class="lang-btn" id="langBtn">العربي</button></div>
  <div class="divider">❦</div>
  <h1>Ahmed &amp; Kholoud</h1>
  <div class="sub" data-i18n="sub">Just the two of us</div>

  <div class="card couple-card">
    <svg viewBox="0 0 220 150" width="220" height="150">
      <g id="boy">
        <circle cx="70" cy="40" r="16" fill="var(--accent2)"/>
        <rect x="54" y="56" width="32" height="55" rx="14" fill="var(--accent)"/>
        <rect id="boyArm" x="82" y="70" width="32" height="9" rx="4.5" fill="var(--accent2)" style="transform-origin:82px 74.5px;"/>
      </g>
      <g id="girl">
        <circle cx="150" cy="40" r="16" fill="var(--gold)"/>
        <path d="M134 56 L166 56 L176 111 L124 111 Z" fill="var(--accent)"/>
        <rect id="girlArm" x="106" y="70" width="32" height="9" rx="4.5" fill="var(--gold)" style="transform-origin:138px 74.5px;"/>
      </g>
      <circle class="join-dot" cx="110" cy="78" r="6" fill="var(--accent2)"/>
      <text class="pop-heart" x="110" y="30" text-anchor="middle">❤️</text>
    </svg>
  </div>

  <div class="card">
    <h2 data-i18n="together">Together Since</h2>
    <div class="timer" id="timer"></div>
  </div>

  <div class="love-wrap">
    <button class="love-btn" id="loveBtn" data-i18n="loveBtn">❤️ I love you</button>
  </div>

  <div class="letter-toggle">
    <button class="letter-btn" id="letterBtn" data-i18n="letterOpen">💌 Open the Letter</button>
  </div>

  <div class="card letter" id="letterCard">
    <h2 data-i18n="letterHeading">My Love</h2>
    <div class="letter-text" id="letterText"></div>
    <div class="heart">❤️</div>
  </div>

  <div class="card">
    <h2 data-i18n="memories">🦢 My whole world</h2>
    <div class="carousel" id="carousel">
      <button class="car-btn car-prev" id="carPrev">&#8249;</button>
      <button class="car-btn car-next" id="carNext">&#8250;</button>
    </div>
    <div class="car-dots" id="carDots"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const START = new Date(2026,5,10,0,0,0); // June 10, 2026

  const LETTER = {
    en:"Every second with you feels like a gift I never want to unwrap too fast.\n\nOur time together has been full of laughter, quiet moments, and dreams I can't wait to watch come true with you.\n\nYou're the reason ordinary days feel like adventures, and the calm I return to no matter how loud the world gets.\n\nThank you for loving me the way you do. I love you more than words can hold.",
    ar:"كل لحظة معاكِ حاسسها كإنها هدية مش عايز أستعجل بيها.\n\nوقتنا مع بعض كان مليان ضحك ولحظات هادية وأحلام مستني أشوفها بتتحقق معاكِ.\n\nإنتِ السبب إن أبسط الأيام تحس فيها إنها مغامرة، وإنتِ الهدوء اللي بارجعله مهما زعقت الدنيا حواليا.\n\nشكرًا إنك بتحبيني بالطريقة دي. بحبك أكتر من أي كلام يقدر يوصفه."
  };

  const I18N = {
    en:{
      sub:"Just the two of us", together:"Together Since",
      loveBtn:"❤️ I love you", letterOpen:"💌 Open the Letter", letterClose:"✖ Close the Letter",
      letterHeading:"My Love", memories:"🦢 My whole world", photoSoon:"Photo coming soon",
      dLabels:["Days","Hours","Minutes","Seconds"],
      sent:"Sent ❤️", received:"💌 They just said: I love you"
    },
    ar:{
      sub:"احنا الاتنين بس", together:"احنا مع بعض من",
      loveBtn:"❤️ بحبك", letterOpen:"💌 افتح الخطاب", letterClose:"✖ اقفل الخطاب",
      letterHeading:"حبيبي", memories:"🦢 دنيتي كلها", photoSoon:"الصورة هتتحط قريب",
      dLabels:["يوم","ساعة","دقيقة","ثانية"],
      sent:"اتبعتت ❤️", received:"💌 قالك: بحبك"
    }
  };

  let lang = 'en';
  function applyLang(){
    const dict = I18N[lang];
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      if(dict[key]) el.textContent = dict[key];
    });
    document.getElementById('langBtn').textContent = lang === 'en' ? 'العربي' : 'English';
    document.body.classList.toggle('ar', lang==='ar');
    document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
    const letterBtn = document.getElementById('letterBtn');
    const card = document.getElementById('letterCard');
    letterBtn.textContent = card.classList.contains('reveal') ? dict.letterClose : dict.letterOpen;
    if(card.classList.contains('reveal')){
      typeWriter(document.getElementById('letterText'), LETTER[lang]);
    }
    updateTimer();
  }
  document.getElementById('langBtn').addEventListener('click', ()=>{
    lang = lang === 'en' ? 'ar' : 'en';
    applyLang();
  });

  function updateTimer(){
    const now = new Date();
    let diff = Math.max(0, now - START);
    const days = Math.floor(diff/86400000);
    const hours = Math.floor(diff/3600000)%24;
    const mins = Math.floor(diff/60000)%60;
    const secs = Math.floor(diff/1000)%60;
    const labels = I18N[lang].dLabels;
    document.getElementById('timer').innerHTML = [days,hours,mins,secs].map((v,i)=>
      `<div class="t-box"><div class="num">${v}</div><div class="lbl">${labels[i]}</div></div>`).join('');
  }
  updateTimer();
  setInterval(updateTimer, 1000);

  setTimeout(()=>{ document.getElementById('splash').classList.add('hide'); }, 1600);

  setTimeout(()=>{
    document.getElementById('boy').classList.add('hug');
    document.getElementById('girl').classList.add('hug');
    document.getElementById('boyArm').classList.add('hug');
    document.getElementById('girlArm').classList.add('hug');
    document.querySelector('.join-dot').classList.add('hug');
    document.querySelector('.pop-heart').classList.add('hug');
  }, 2200);

  let typeTimer = null;
  function typeWriter(el, text){
    clearInterval(typeTimer);
    let i = 0;
    el.textContent = '';
    typeTimer = setInterval(()=>{
      i += 1;
      if(i < text.length){
        el.innerHTML = text.slice(0,i).replace(/\n/g,'<br>') + '<span class="cursor">|</span>';
      } else {
        el.innerHTML = text.replace(/\n/g,'<br>');
        clearInterval(typeTimer);
      }
    }, 70);
  }

  document.getElementById('letterBtn').addEventListener('click', function(){
    const card = document.getElementById('letterCard');
    const isOpen = card.classList.contains('reveal');
    const dict = I18N[lang];
    if(isOpen){
      card.classList.remove('reveal');
      clearInterval(typeTimer);
      this.textContent = dict.letterOpen;
    } else {
      card.classList.add('reveal');
      this.textContent = dict.letterClose;
      card.scrollIntoView({behavior:'smooth', block:'center'});
      typeWriter(document.getElementById('letterText'), LETTER[lang]);
    }
  });

  // shared "I love you" tap, synced across viewers via db
  let justSentTs = 0;
  function showToast(key){
    const t = document.getElementById('toast');
    t.textContent = I18N[lang][key];
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2400);
  }
  (async function(){
    let db = null;
    try{ db = await claude.use('db'); }catch(e){}
    const btn = document.getElementById('loveBtn');
    if(!db){ return; } // button still visually works but won't sync without db
    const doc = db.doc('love/status');
    try{
      doc.onSnapshot((snap)=>{
        const data = snap && typeof snap.data === 'function' ? snap.data() : snap;
        if(data && data.ts && data.ts !== justSentTs){
          showToast('received');
        }
      });
    }catch(e){}
    btn.addEventListener('click', async ()=>{
      const ts = Date.now();
      justSentTs = ts;
      try{
        await doc.set({ts});
        showToast('sent');
      }catch(e){
        showToast('sent');
      }
    });
  })();

  applyLang();

  // photo carousel

  (function(){
    const car = document.getElementById('carousel');
    const dotsWrap = document.getElementById('carDots');
    let idx = 0;
    PHOTOS.forEach((src, i)=>{
      const img = document.createElement('img');
      img.src = src;
      if(i===0) img.classList.add('active');
      car.insertBefore(img, document.getElementById('carPrev'));
      const dot = document.createElement('button');
      dot.className = 'dot' + (i===0 ? ' active' : '');
      dot.addEventListener('click', ()=>goTo(i));
      dotsWrap.appendChild(dot);
    });
    const imgs = () => car.querySelectorAll('img');
    const dots = () => dotsWrap.querySelectorAll('.dot');
    let auto = null;
    function goTo(i){
      imgs()[idx].classList.remove('active');
      dots()[idx].classList.remove('active');
      idx = (i + PHOTOS.length) % PHOTOS.length;
      imgs()[idx].classList.add('active');
      dots()[idx].classList.add('active');
      resetAuto();
    }
    function resetAuto(){
      clearInterval(auto);
      auto = setInterval(()=>goTo(idx+1), 4500);
    }
    document.getElementById('carPrev').addEventListener('click', ()=>goTo(idx-1));
    document.getElementById('carNext').addEventListener('click', ()=>goTo(idx+1));
    resetAuto();
  })();
</script>
